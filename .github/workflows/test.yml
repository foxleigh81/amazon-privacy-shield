name: Test extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: amazon-privacy-shield
          path: dist/*.zip
